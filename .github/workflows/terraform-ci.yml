
name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  azure-auth:
    name: Test Azure OIDC authentication
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: 239c3186-45e5-49b5-b406-ba0b44ebd5ba
          tenant-id: 0478391b-2ecf-4e4d-9187-e2ba4e803624
          subscription-id: 5ec2fb09-eb60-4823-a43e-bcde9564bfe0

      - name: Verify Azure authentication
        run: az account show --query "{name:name, tenantId:tenantId}" --output table
