
name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm deployment to the dev environment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Terraform to Azure
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: "0478391b-2ecf-4e4d-9187-e2ba4e803624"
      ARM_SUBSCRIPTION_ID: "5ec2fb09-eb60-4823-a43e-bcde9564bfe0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform validate

      - name: Generate saved Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply saved Terraform plan
        run: terraform apply -input=false -no-color tfplan
